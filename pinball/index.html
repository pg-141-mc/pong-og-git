<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Pong — Enhanced</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="game-wrap">
    <div class="scoreboard">
      <div id="playerScore">0</div>
      <div class="title">PONG</div>
      <div id="computerScore">0</div>
    </div>

    <div class="controls-row">
      <div class="left-controls">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="normal" selected>Normal</option>
          <option value="hard">Hard</option>
        </select>

        <label for="winScore">Win score</label>
        <input id="winScore" type="number" min="1" value="7" />

        <label for="volume">Volume</label>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" />
      </div>

      <div class="right-controls">
        <button id="startBtn">Start</button>
        <button id="pauseBtn" disabled>Pause</button>
        <button id="restartBtn" disabled>Restart</button>
      </div>
    </div>

    <canvas id="gameCanvas" width="800" height="500" tabindex="0"></canvas>

    <div class="controls">
      Controls: Move left paddle with mouse or Arrow Up / Arrow Down keys. Press Space to Pause/Resume.
    </div>
  </div>

  <div id="overlay" class="overlay">
    <div id="overlayContent" class="overlay-content">
      <h1>PONG</h1>
      <p id="overlayMsg">Press Start to play</p>
      <button id="overlayStart">Start Game</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
